[project]
name = "t-shirt-shop"
version = "0.1.0"
description = ""
authors = [
    {name = "FunkyDrama",email = "cripswhigga18@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.121.0,<0.122.0)",
    "uvicorn (>=0.38.0,<0.39.0)",
    "pydantic-settings (>=2.11.0,<3.0.0)",
    "sqlalchemy (>=2.0.44,<3.0.0)",
    "alembic (>=1.17.1,<2.0.0)",
    "asyncpg (>=0.30.0,<0.31.0)",
    "uvloop (>=0.22.1,<0.23.0)",
    "greenlet (>=3.2.4,<4.0.0)",
    "redis (>=7.0.1,<8.0.0)",
    "asgi-lifespan (>=2.1.0,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "aiosqlite (>=0.21.0,<0.22.0)"
