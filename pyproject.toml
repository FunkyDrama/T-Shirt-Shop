    "pytest (>=8.4.2,<9.0.0)",
    "pytest-asyncio (>=1.2.0,<2.0.0)",
    "coverage (>=7.11.1,<8.0.0)",
    "black (>=25.9.0,<26.0.0)",
    "fakeredis (>=2.32.1,<3.0.0)"
]
