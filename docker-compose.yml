services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - .env
    networks:
      - app-network
    command: >
      sh -c "
        alembic -c alembic.ini upgrade head &&
        python -m src.main
      "
  redis:
    image: redis:7.2
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - app-network

  db:
    image: postgres:17
    env_file:
      - .env
    container_name: db
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h ${POSTGRES_HOST} -p ${POSTGRES_PORT}" ]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network

  tests:
    build: .
    environment:
      - PYTHONPATH=/app
    command: sh -c "pytest -q"

volumes:
  postgres-data:

networks:
  app-network:
    driver: bridge